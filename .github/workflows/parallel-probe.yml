name: Parallel video probe
on:
  push:
    branches: [ main ]
    paths: [ probe_request.json ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "${{ github.run_id }}" > AUTOSTAT_LATEST_PROBE_RUN_ID.txt
          echo "${{ github.sha }}" > AUTOSTAT_LATEST_PROBE_COMMIT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUTOSTAT_LATEST_PROBE_RUN_ID.txt AUTOSTAT_LATEST_PROBE_COMMIT.txt
          git commit -m "Record latest AUTOSTAT probe run ${{ github.run_id }}" || echo "No changes"
          git push
  probe:
    needs: marker
    strategy:
      fail-fast: false
      matrix:
        part: [0,1,2,3,4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
          python -m pip install --upgrade https://github.com/yt-dlp/yt-dlp/archive/master.zip
      - run: python parallel_processor.py probe probe_request.json ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe-part-${{ matrix.part }}
          path: probe-output
          retention-days: 7
