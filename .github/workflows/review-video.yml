name: Review AUTOSTAT video

on:
  push:
    branches: [ main ]
    paths:
      - review_request.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow faster-whisper
          python -m pip install --upgrade https://github.com/yt-dlp/yt-dlp/archive/master.zip

      - name: Process video
        run: |
          python review_pipeline.py

      - name: Commit review outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Generate AUTOSTAT video review outputs"
            git push
          fi
